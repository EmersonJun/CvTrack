spring:
  application:
    name: cv-match

  # Lê o arquivo .env (se existir) como fonte de propriedades.
  # Funciona rodando tanto da raiz do projeto quanto da pasta backend/.
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"

  # Valores vêm de variáveis de ambiente; o que está depois do ":" é o padrão local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cvmatch}
    username: ${POSTGRES_USER:cvmatch}
    password: ${POSTGRES_PASSWORD:cvmatch}

  jpa:
    # O schema é responsabilidade do Flyway; o Hibernate só valida
    hibernate:
      ddl-auto: validate
    # Evita consultas ao banco disparadas pela camada web (anti-pattern)
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

cvmatch:
  jwt:
    # Padrão SOMENTE para desenvolvimento. Em produção, defina JWT_SECRET.
    secret: ${JWT_SECRET:dev-only-secret-troque-em-producao-0123456789}
    expiracao-minutos: ${JWT_EXPIRATION_MINUTES:60}
  cors:
    # Separe vários endereços por vírgula
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
