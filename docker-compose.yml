services:
  postgres:
    image: postgres:16-alpine
    container_name: cvmatch-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cvmatch}
      POSTGRES_USER: ${POSTGRES_USER:-cvmatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cvmatch}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: cvmatch-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cvmatch}
      POSTGRES_USER: ${POSTGRES_USER:-cvmatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cvmatch}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-troque-em-producao-0123456789}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: cvmatch-frontend
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy

  ollama:
    image: ollama/ollama
    container_name: cvmatch-ollama
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  postgres-data:
  ollama-data:
