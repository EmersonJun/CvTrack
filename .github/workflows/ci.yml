name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - build e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar e rodar os testes
        run: mvn -B verify

      - name: Publicar relatórios de teste
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: backend/target/surefire-reports/
          retention-days: 7

  docker:
    name: Imagens Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Validar o docker compose
        run: docker compose config --quiet

      - name: Construir a imagem do backend
        run: docker build -t cvmatch-backend:${{ github.sha }} backend

      - name: Construir a imagem do frontend
        run: docker build -t cvmatch-frontend:${{ github.sha }} frontend

  frontend:
    name: Frontend - build e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Compilar
        run: npm run build

      - name: Rodar os testes
        run: npm run test:ci
